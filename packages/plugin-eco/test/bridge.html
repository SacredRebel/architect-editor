<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>eco bridge harness (E3)</title>
    <style>
      body {
        margin: 0;
        font: 14px/1.4 system-ui, sans-serif;
        background: #111;
        color: #eee;
      }
      #log {
        height: 28vh;
        overflow: auto;
        padding: 8px 12px;
        white-space: pre-wrap;
        background: #1a1a1a;
        border-bottom: 1px solid #333;
      }
      iframe {
        width: 100%;
        height: 72vh;
        border: 0;
        background: #000;
      }
      .hint {
        padding: 8px 12px;
        color: #aaa;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="hint">
      <code>cd apps/editor && bun run build:static && npx serve out</code>
      then open <code>/eco-bridge.html</code>. Optional
      <code>?embed=http://localhost:3000/builder/embed/</code>.
    </div>
    <div id="log"></div>
    <iframe id="editor" title="eco-embed"></iframe>
    <script>
      const logEl = document.getElementById('log')
      const iframe = document.getElementById('editor')
      const params = new URLSearchParams(location.search)
      const embedUrl = new URL(
        params.get('embed') || '/builder/embed/',
        location.origin,
      ).href
      const embedOrigin = new URL(embedUrl).origin

      function log(line) {
        logEl.textContent += line + '\n'
        logEl.scrollTop = logEl.scrollHeight
        console.log(line)
      }

      /** 64×64 synthetic hill + 3 guides; optional refGlb from fixture. */
      async function syntheticSite(refGlb) {
        const w = 64
        const h = 64
        const heights = []
        for (let r = 0; r < h; r++) {
          for (let c = 0; c < w; c++) {
            const dx = (c - 32) / 32
            const dz = (r - 32) / 32
            const hill = Math.max(0, 1 - (dx * dx + dz * dz)) * 8
            heights.push(100 + hill)
          }
        }
        return {
          v: 'eco/1',
          originLL: [-122.4, 37.8],
          originElevM: 100,
          terrain: {
            w,
            h,
            stepM: 1,
            originOffsetM: [-32, 32],
            heights,
          },
          guides: [
            {
              kind: 'boundary',
              name: 'lot',
              pts: [
                [-30, -30],
                [30, -30],
                [30, 30],
                [-30, 30],
                [-30, -30],
              ],
            },
            {
              kind: 'easement',
              name: 'setback',
              pts: [
                [-20, -20],
                [20, -20],
                [20, 20],
                [-20, 20],
                [-20, -20],
              ],
            },
            {
              kind: 'footprint',
              name: 'pad',
              pts: [
                [-4, -4],
                [4, -4],
                [4, 4],
                [-4, 4],
                [-4, -4],
              ],
            },
          ],
          refGlb: refGlb || undefined,
          northDeg: 15,
        }
      }

      async function loadRefGlb() {
        try {
          const res = await fetch(new URL('fixture.glb', location.href))
          if (!res.ok) return null
          const buf = await res.arrayBuffer()
          const bytes = new Uint8Array(buf)
          let binary = ''
          for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i])
          return btoa(binary)
        } catch {
          return null
        }
      }

      iframe.src = embedUrl
      log('iframe → ' + embedUrl)

      window.addEventListener('message', async (event) => {
        if (!event.data || typeof event.data.t !== 'string') return
        if (!String(event.data.t).startsWith('eco:')) return
        const preview =
          event.data.t === 'eco:scene'
            ? `eco:scene keys=${Object.keys(event.data.scene || {}).join(',')}`
            : JSON.stringify(event.data).slice(0, 240)
        log('← ' + preview)

        if (event.data.t === 'eco:ready') {
          const refGlb = await loadRefGlb()
          log(refGlb ? 'loaded fixture refGlb' : 'no fixture refGlb')
          iframe.contentWindow.postMessage(
            { t: 'eco:load-site', site: await syntheticSite(refGlb) },
            embedOrigin,
          )
          setTimeout(() => {
            iframe.contentWindow.postMessage(
              { t: 'eco:request-export', what: 'scene' },
              embedOrigin,
            )
          }, 500)
        }

        if (event.data.t === 'eco:scene') {
          log('DONE — scene export received (draw walls on the hill to screenshot)')
        }
      })

      iframe.addEventListener('load', () => {
        log('iframe load — sending eco:hello')
        iframe.contentWindow.postMessage({ t: 'eco:hello', v: 'eco/1' }, embedOrigin)
      })
    </script>
  </body>
</html>
